              priceRule:
                description: Discount code price rule.
                anyOf:
                - title: Percentage price rule
                  example:
                    type: percentage
                    value: 50
                  type: object
                  properties:
                    type:
                      description: Discount is a percentage of the total price.
                      type: string
                      enum:
                      - percentage
