    CreateOrderDTO:
      type: object
      properties:
        startDate:
          title: ISO 8601 date-time
          description: Start date of the order.
          type: string
        duration:
          description: Duration of the order.
          type: object
          properties:
            period:
              description: Period of the duration.
              type: string
              enum:
              - minutes
              - hours
              - days
              - weeks
              - months
              - days_within_opening_hours
              - years
            value:
              description: Value of the duration.
              type: integer
              minimum: 0
              maximum: 9007199254740991
          required:
          - period
          - value
        storeId:
          description: Store ID where the booking is made to.
          type: string
        customer:
          description: Customer details.
          type: object
          properties:
            firstName:
              description: First name of the customer.
              type: string
            lastName:
              description: Last name of the customer.
              type: string
            phone:
              description: Phone number of the customer.
              type: string
            email:
              description: Email of the customer.
              type: string
            marketingConsent:
              description: Whether the customer has given marketing consent.
              type: boolean
            language:
              description: Language of the customer.
              type: string
              enum:
              - fi
              - en
              - ru
              - de
              - sk
              - sv
              - nl
              - hu
              - 'no'
              - fr
              - es
              - it
              - cs
              - da
              - lt
              - et
              - pl
              - sl
              - hr
              - pt
              - br
              - lv
              - tr
              - uk
            address:
              description: Address of the customer.
              type: object
              properties:
                address:
                  description: Street address.
                  type: string
                zipCode:
                  description: Zip code.
                  type: string
                city:
                  description: City.
                  type: string
                country:
                  description: Country.
                  type: string
                state:
                  description: State.
                  type: string
                details:
                  description: Additional address details.
                  type: string
              required:
              - address
          required:
          - firstName
          - lastName
          - phone
          - email
          - marketingConsent
        items:
          description: Items in the order.
          type: array
          items:
            example:
              productId: enmSzQbHFtkzNIWp9e19
              variantId: 26CbdcY1E73Py0fvb4IZ
              quantity: 1
              duration:
                period: days
                value: 1
            type: object
            properties:
              productId:
                description: Product ID of the item.
                type: string
              variantId:
                description: Chosen variant ID of the item. If not specificed, and product has multiple variants, the first variant is used.
                type: string
              quantity:
                description: Quantity of the items. Defaults to 1.
                default: 1
                type: integer
                minimum: 0
                maximum: 9007199254740991
              duration:
                description: You can define a different duration of each item by setting a duration here. If not specified, the provided order duration is used.
                type: object
                properties:
                  period:
                    description: Period of the duration.
                    type: string
                    enum:
                    - minutes
                    - hours
                    - days
                    - weeks
                    - months
                    - days_within_opening_hours
                    - years
                  value:
                    description: Value of the duration.
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                required:
                - period
                - value
              packageProductVariantIds:
                description: If the product is a package, you can define which variants are selected for each package product in the package by providing their IDs here. If some variants are not specified, and package product has multiple variants, the first variant is used.
                type: array
                items:
                  type: string
            required:
            - productId
        paid:
          description: Whether the order should be marked as paid or not.
          type: boolean
        externalOrderId:
          description: Reference to potential external order ID
          type: string
      required:
      - startDate
      - duration
      - storeId
      - customer
      - items
      example:
        startDate: '2026-07-19T01:04:27.150Z'
        duration:
          period: days
          value: 1
        storeId: G0YFPi1GDccdi1JyqsKR
        customer:
          firstName: John
          lastName: Doe
          phone: '+1555555555'
          email: john@doe.com
          marketingConsent: true
          language: en
          address:
            address: 123 Main St
            zipCode: '12345'
            city: New York
            country: United States
            state: New York
        items:
        - productId: enmSzQbHFtkzNIWp9e19
          variantId: 26CbdcY1E73Py0fvb4IZ
          quantity: 1
          duration:
            period: days
            value: 1
        paid: true
        externalOrderId: 1234-5678-9012
