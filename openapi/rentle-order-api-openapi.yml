                  itemCodes:
                    description: List of given inventory item codes for the item.
                    type: array
                    items:
                      type: string
                  variantId:
                    description: Selected variant id.
                    type: string
                  variantValues:
                    description: Selected variant values.
                    type: array
                    items:
                      title: Localized field
                      description: Localized text field.
                      allOf:
                      - additionalProperties:
                          type: string
