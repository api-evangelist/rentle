                    description: Start date of the item.
                    type: string
                  endDate:
                    title: ISO 8601 date-time
                    description: End date of the item. This will show the initial end date even when the item is returned.
                    type: string
                  durationPeriod:
                    description: Whether duration is using 24h rental period or following store opening hours
                    type: string
                    enum:
                    - 24h
                    - opening_hours
                  customDurationLabel:
                    description: Custom duration label for the item if given
                    title: Localized field
                    allOf:
                    - additionalProperties:
                        type: string
