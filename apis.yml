aid: rentle
name: Rentle
description: >-
  Rentle, now operating as Twice Commerce, is a Helsinki-founded (2018)
  circular-commerce platform that lets merchants run rentals, resale, and
  subscriptions from one system. Its Twice Admin API (OpenAPI 3.0.0, date-based
  version 2023-02-01) exposes categories, customers, inventory articles, SKUs,
  products, orders, stores, merchant details, discount codes, API keys, and
  webhooks over a REST interface authenticated with HTTP Basic API keys.
  Outbound webhooks cover nine order and product lifecycle events. This profile
  was enriched by the API Evangelist pipeline from Rentle/Twice Commerce public
  developer surfaces.
